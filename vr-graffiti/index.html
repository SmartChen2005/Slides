<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="VR Graffiti: a 6:55 XR concept presentation about learning lettering through recorded gestures.">
  <title>VR Graffiti | XR Concept</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='white'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../deck-transition.css">
  <script src="content.js" defer></script>
  <script src="lettering.js" defer></script>
  <script src="learning.js" defer></script>
  <script src="slides.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#slide-1">Skip to presentation</a>
  <div class="presentation">
    <main class="stage" aria-label="VR Graffiti concept presentation" style="view-transition-name: open-deck">
      <div class="slide-canvas" id="slides"></div>
    </main>
    <footer class="site-footer">
      <div class="deck-position"><a href="../" aria-label="Back to slide archive">Archive</a><button id="previous" aria-label="Previous slide">Prev</button><span id="slide-counter">01 / 12</span><button id="next" class="primary" aria-label="Next slide">Next</button><span id="slide-time">0:20</span></div>
      <div class="transport"><label for="animation-time" class="sr-only">Animation progress in seconds</label><input id="animation-time" type="range" min="0" max="7" step="0.01" value="0"><output id="animation-time-label" for="animation-time">0:00</output></div>
      <div class="deck-controls">
        <button id="replay" aria-label="Replay concept animation">Replay</button>
        <button id="pause" aria-pressed="false">Pause</button>
        <button id="fullscreen" class="icon-button" aria-label="Enter fullscreen"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
      </div>
    </footer>
    <div class="progress-track" aria-hidden="true"><div id="deck-progress"></div></div>
  </div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="lettering-reference" class="reference-dialog" aria-labelledby="reference-title">
    <div class="reference-dialog-header"><h2 id="reference-title">Lettering reference</h2><button type="button" id="reference-close" autofocus>Close</button></div>
    <img id="reference-image" alt="">
    <p id="reference-credit"></p>
    <p class="reference-dialog-help">Full photograph. The slide uses a cropped detail.</p>
  </dialog>
  <noscript>This presentation needs JavaScript for navigation and animations. Use the accompanying PDF for a static version.</noscript>
</body>
</html>
